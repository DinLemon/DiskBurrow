[workspace]
resolver = "3"
members = ["vendor/disktree-core", "crates/diskburrow-services", "crates/diskburrow-windows", "crates/diskburrow-app", "crates/diskburrow-engine"]

[workspace.package]
version = "0.3.0-alpha.3"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/DinLemon/DiskBurrow"

[workspace.dependencies]
disktree-core = { path = "vendor/disktree-core" }
anyhow = "1"
rayon = "1"
rustc-hash = "2"

[workspace.lints.rust]
unsafe_code = "warn"

[profile.dev]
debug = "limited"
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
strip = "debuginfo"
[profile.release.package.gpui-pre-macros]
debug-assertions = true
