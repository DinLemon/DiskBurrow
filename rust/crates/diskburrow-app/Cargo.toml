[package]
name = "diskburrow-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "DiskBurrow"
path = "src/main.rs"

[dependencies]
diskburrow-engine = { path = "../diskburrow-engine" }
diskburrow-services = { path = "../diskburrow-services" }
diskburrow-windows = { path = "../diskburrow-windows" }
disktree-core = { workspace = true }
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets"] }
gpui-omarchy = "0.1.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dunce = "1"
futures-lite = "2"
rand = "0.9"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls"] }

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets", "test-support"] }
