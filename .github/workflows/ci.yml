name: Windows validation and portable release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Locked restore, Release build and tests
        shell: pwsh
        run: |
          dotnet restore DiskBurrow.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build DiskBurrow.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/DiskBurrow.Tests -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable release
        shell: pwsh
        run: |
          $version = '0.1.1'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') { throw 'Invalid release tag.' }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          ./scripts/publish.ps1 -Version $version -OutputDirectory ./artifacts/portable-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify extracted executable with isolated runtime root
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/portable-smoke,work/isolated-dotnet,work/runtime-verification | Out-Null
          'DiskBurrow owned runtime verification workspace' | Set-Content -LiteralPath work/runtime-verification/.diskburrow-runtime-workspace
          $archives = @(Get-ChildItem artifacts/portable-release/*.zip)
          if ($archives.Count -ne 1) { throw 'Expected one archive.' }
          $archive = $archives[0]
          $expected = (Get-Content -LiteralPath ($archive.FullName + '.sha256')).Split(' ')[0]
          if ((Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Checksum mismatch.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath work/portable-smoke
          $env:DOTNET_ROOT = (Resolve-Path work/isolated-dotnet).Path
          $env:DOTNET_ROOT_X64 = $env:DOTNET_ROOT
          $env:DOTNET_MULTILEVEL_LOOKUP = '0'
          $executable = (Resolve-Path work/portable-smoke/DiskBurrow.exe).Path
          $workspace = (Resolve-Path work/runtime-verification).Path
          $process = Start-Process -FilePath $executable -ArgumentList @('--verify-runtime', ('"' + $workspace + '"')) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Runtime verifier timeout.' }
          if ($process.ExitCode -ne 0) { throw 'Runtime verifier failed.' }
          $proofs = @(Get-ChildItem work/runtime-verification/runtime-*/runtime-proof.json)
          if ($proofs.Count -ne 1) { throw 'Expected one runtime proof.' }
          $proof = $proofs[0]
          $runtime = Get-Content -LiteralPath $proof.FullName -Raw | ConvertFrom-Json
          $packageRoot = (Resolve-Path work/portable-smoke).Path + [IO.Path]::DirectorySeparatorChar
          if (-not $runtime.Success -or $runtime.Runtime -ne '10.0.12' -or -not $runtime.ResourcesSwitched -or $runtime.MonitoringStarted -or $runtime.CleanupExecuted -or $runtime.AutostartApplied) { throw 'Runtime proof is incomplete.' }
          foreach ($module in @('coreclr.dll','hostpolicy.dll','e_sqlite3.dll')) {
            if (-not $runtime.Modules.$module.StartsWith($packageRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Runtime module was not loaded from the ZIP.' }
          }
          if ($runtime.DataDirectory.StartsWith($packageRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Verifier data must be outside the EXE folder.' }
      - uses: actions/upload-artifact@v4
        with:
          name: portable-release
          path: |
            artifacts/portable-release/*.zip
            artifacts/portable-release/*.zip.sha256
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-release
          path: release-assets
      - name: Attach validated artifacts to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GH_REPO --verify-tag --title "DiskBurrow $tag" --notes 'Portable Windows x64. Unsigned. See README and verification limitations before use.'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | Where-Object { $_.Name -match '^DiskBurrow-[0-9A-Za-z.-]+-win-x64\.zip(\.sha256)?$' } | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw 'Expected exactly ZIP and checksum.' }
          gh release upload $tag @assets --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
