name: Rust preview validation
on:
  push:
    branches: ['rewrite/rust-gpui']
  pull_request:
    paths: ['rust/**', 'scripts/*rust*', 'scripts/GETTING-STARTED-RUST.txt', '.github/workflows/rust.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format, strict lint and native fixture tests
        shell: pwsh
        working-directory: rust
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -j 2 -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package static-CRT preview
        shell: pwsh
        run: |
          ./scripts/publish-rust.ps1 -OutputDirectory ./artifacts/rust-preview -TargetDirectory ./work/rust-release-target
      - name: Verify freshly extracted native executable
        shell: pwsh
        run: |
          ./scripts/verify-rust-ci.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rust-preview
          path: |
            artifacts/rust-preview/*.zip
            artifacts/rust-preview/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-runtime-proof
          path: work/rust-proof/runtime.json
          if-no-files-found: ignore
